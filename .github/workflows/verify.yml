name: Verify M0-M6
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated local Supabase
        run: pnpm local:start > /tmp/supabase-start.log 2>&1
      - run: pnpm local:setup
      - run: pnpm verify:full
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: |
            test-results/
            playwright-report/
      - run: pnpm local:stop
        if: always()
