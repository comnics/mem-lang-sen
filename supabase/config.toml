project_id = "mem-lang-sen"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 10
max_client_conn = 100
[db.seed]
enabled = false
[realtime]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "10MiB"
[storage.s3_protocol]
enabled = false
[storage.vector]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3100"
additional_redirect_urls = ["http://127.0.0.1:3100/auth/callback", "http://127.0.0.1:3100/auth/callback?next=/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10
[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 200
token_verifications = 100
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1s"
[auth.email.template.confirmation]
subject = "문장정원 이메일 확인"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.recovery]
subject = "문장정원 비밀번호 재설정"
content_path = "./supabase/templates/recovery.html"
[edge_runtime]
enabled = false
[analytics]
enabled = false
