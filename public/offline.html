<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오프라인 | 문장정원</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; color: #21302d; background: #fffefa; }
      main { max-width: 520px; margin: 0 auto; min-height: 100svh; display: grid; place-content: center; padding: 24px; }
      section { border: 1px solid #d8ddd7; border-radius: 8px; padding: 20px; background: white; }
      h1 { margin: 0 0 8px; font-size: 1.4rem; }
      p { margin: 0; line-height: 1.6; color: #61706a; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>네트워크 연결이 필요합니다.</h1>
        <p>열려 있던 학습 제출은 앱 안에서 다시 전송할 수 있습니다. 연결 후 오늘 화면을 새로 열어 주세요.</p>
      </section>
    </main>
  </body>
</html>
